---
- name: Mac Setup Playbook
  hosts: all
  connection: local
  gather_facts: false
  vars_files:
    - vars/homebrew.yml
    - vars/dotfiles.yml
    - vars/mas.yml
    - vars/dock.yml
  roles:
    - role: elliotweiser.osx-command-line-tools
    - role: geerlingguy.mac.homebrew
    - role: geerlingguy.mac.mas
    - role: geerlingguy.mac.dock
    - role: geerlingguy.dotfiles
  tasks:
    - import_tasks: tasks/dotfiles.yml
    - import_tasks: tasks/macos-preferences.yml
    - import_tasks: tasks/dev-environments.yml
    - import_tasks: tasks/ssh-gpg-setup.yml
    - import_tasks: tasks/validation.yml
